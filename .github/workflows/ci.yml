name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Bundle the app (ad-hoc signed)
        run: scripts/build-app.sh

  integration:
    # moves a real window on the runner's display
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Grant Accessibility access
        # Runners have SIP off, so the system TCC database can be written. Grant the app (by
        # bundle id and by path), the test tools, and each ancestor of this shell, any of which
        # might count as "responsible" for a test tool. Screen Recording isn't granted to the
        # app: window titles have to work without it, as on a real install.
        run: |
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier, flags)
            VALUES ('kTCCServiceAccessibility', 'com.trevinlee.tilespace', 0, 2, 4, 1, 'UNUSED', 0);"
          clients=("$PWD/build/TileSpace.app/Contents/MacOS/TileSpace" "$PWD/build/trusted" "$PWD/build/input" /bin/zsh /bin/bash)
          pid=$$
          while [ "$pid" -gt 1 ]; do
            clients+=("$(ps -o comm= -p $pid)")
            pid=$(ps -o ppid= -p $pid | tr -d ' ')
          done
          printf 'granting:\n'; printf '  %s\n' "${clients[@]}"
          for c in "${clients[@]}"; do
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier, flags)
              VALUES ('kTCCServiceAccessibility', '$c', 1, 2, 4, 1, 'UNUSED', 0);"
          done
          printf 'Screen Recording is granted to:\n'
          sudo sqlite3 "$db" "SELECT '  ' || client FROM access WHERE service = 'kTCCServiceScreenCapture' AND auth_value = 2;"
      - name: Integration test
        run: Tests/Integration/run.sh
      - name: Screenshot and app log on failure
        if: failure()
        run: |
          screencapture -x screen.png
          cat build/app.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screen
          path: screen.png
